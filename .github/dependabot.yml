# Dependabot configuration for fetchconfig-web.
#
# Enables Dependabot version updates for the Perl (CPAN) dependencies declared
# in the cpanfile, and for the GitHub Actions used by any workflows. Dependabot
# opens pull requests that bump these to newer versions.
#
# Notes:
#   - The CPAN ecosystem reads ./cpanfile (kept in sync with Makefile.PL).
#   - A new release is only proposed after GitHub's default 3-day cooldown.
#   - Schedules below are weekly; change "interval" to daily or monthly to taste.
#   - CPAN support in Dependabot is comparatively new; after committing this,
#     confirm pickup under Insights -> Dependency graph -> Dependabot.
version: 2
updates:
  # Perl module dependencies (from cpanfile).
  - package-ecosystem: "cpan"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  # Keep any GitHub Actions workflows up to date (harmless if none exist yet).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
